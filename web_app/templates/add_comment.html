{% extends 'base.html' %}

{% block title %}新增評論{% endblock %}
{% block lang %}zh{% endblock %}

{% load static %}

{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/add_comment.css' %}">
{% endblock %}

{% block content %}
<div class="container" style="margin-top:80px"></div>
<div class="comment-container">
    <div class="back-button" onclick="history.back()">
        <a href="#">返回</a>
    </div>
    
  <form id="comment-form" class="comment-form" onsubmit="return false;">
    <div class="form-row">
        <div class="form-col-left">
            <div class="form-group">
                <label for="academic" class="form-label">學制</label>
                <select id="academic" class="form-control">
                    <option value="">請選擇學制</option>
                {% for a in academics %}
                <option value="{{ a.id }}" {% if selected_academic and selected_academic.id == a.id %}selected{% endif %}>{{ a.name }}</option>
                {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="department" class="form-label">科系</label>
                <select id="department" class="form-control">
                <option value="">請先選擇學制</option>
                {% if selected_department %}
                <option value="{{ selected_department.id }}" selected>{{ selected_department.name }}</option>
                {% endif %}
                </select>
            </div>
            <div class="form-group">
                <label for="grade" class="form-label">年級</label>
                <select id="grade" class="form-control">
                <option value="">請先選擇學制</option>
                {% if selected_grade %}
                <option value="{{ selected_grade }}" selected>{{ selected_grade }}</option>
                {% endif %}
                </select>
            </div>
            <div class="form-group course-group">
                <label for="course" class="form-label">課程</label>
                <select id="course" name="course" class="form-control course" required>
                <option value="">請先選擇學制、科系和年級</option>
                {% if selected_course %}
                <option value="{{ selected_course.id }}" selected>{{ selected_course.course_name }}（{{ selected_course.course_teacher }}）</option>
                {% endif %}
                </select>
            </div>
        </div>
        <div class="form-col">
            <div class="display-mode-container">
                <label>顯示方式</label>
                <div class="user-info-container">
                    <div class="user-info">
                        <img src="{% static 'image/anonymous.png' %}" alt="User Avatar" class="avatar">
                        <span class="username">匿名</span>
                    </div>
                    <div class="anonymous-options">
                        <input type="radio" id="anonymous_yes" name="anonymous" value="no" checked>
                        <label for="anonymous_yes">匿名</label>
                        <input type="radio" id="anonymous_no" name="anonymous" value="yes">
                        <label for="anonymous_no">實名</label>
                    </div>
                </div>
            </div>
            <div class="form-group rating-group">
                <label>課程評分</label>
                <div class="rating-controls">
                    <div class="stars editable" id="rating-stars" data-rating="1">
                        <i class="fa-regular fa-star" data-rating="1"></i>
                        <i class="fa-regular fa-star" data-rating="2"></i>
                        <i class="fa-regular fa-star" data-rating="3"></i>
                        <i class="fa-regular fa-star" data-rating="4"></i>
                        <i class="fa-regular fa-star" data-rating="5"></i>
                        <input type="hidden" name="rating" id="rating-input" value="1">
                        <span class="rating-text">{{ avg_rating|floatformat:1 }}/5.0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
        
    <div class="top-row-container">
        <div class="course-info-container">
            <div class="comment-header">
                <h3>{{ selected_course.course_name }}</h3>
                <h3>授課教師: {{ selected_course.course_teacher }}</h3>
            </div>
        </div>
    </div>
    
    <div class="comment-content">
        <div class="comment-text-area">
            <textarea id="comment_text" name="comment_text" rows="10" placeholder="輸入評論內容..."></textarea>
        </div>
        
        <div class="arrows-container">
            <div class="arrow">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
            <button type="button" id="convert_btn" class="btn-convert">轉換</button>
            <div class="arrow">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>
        
        <div class="comment-preview">
            <div class="preview-content">
                <textarea id="preview_text" placeholder="可以在這裡直接編輯或使用轉換按鈕..."></textarea>
            </div>
        </div>
    </div>
    
    <div class="add-comment-form-actions">
        <button type="submit" class="btn-submit">送出</button>
    </div>
</form>
</div>
<!-- 內嵌資料供 JS 使用 -->
<script id="departments-data" type="application/json">{{ departments_data|safe }}</script>
<script id="grades-data" type="application/json">{{ grades_data|safe }}</script>
<script id="courses-data" type="application/json">{{ courses_json|safe }}</script>
<script>
  window.__PRESELECTED__ = {
    courseId: {{ selected_course.id|default:'null' }},
    academicId: {{ selected_academic.id|default:'null' }},
    departmentId: {{ selected_department.id|default:'null' }},
    grade: {% if selected_grade %}"{{ selected_grade }}"{% else %}null{% endif %}
  };

    // 若是從課程點進來，直接上鎖四個下拉（專屬狀態）
    (function lockIfPreselected() {
    const pre = window.__PRESELECTED__ || {};
    const academic = document.getElementById('academic');
    const department = document.getElementById('department');
    const grade = document.getElementById('grade');
    const course = document.getElementById('course');

    // 只有當 courseId 存在時才鎖定（確定是從課程跳轉）
    if (pre.courseId) {
        // 直接設定值（如果你的 populate 流程已經把唯一選項塞好，這裡只是保險）
        if (pre.academicId && academic) academic.value = String(pre.academicId);
        if (pre.departmentId && department) department.value = String(pre.departmentId);
        if (pre.grade && grade) grade.value = pre.grade;
        if (course) course.value = String(pre.courseId);

        // 上鎖避免被改動（如果你希望仍可改，移除此段）
        [academic, department, grade, course].forEach(sel => {
        if (sel) sel.disabled = true;
        });
    }
    })();
</script>
<script src="{% static 'js/add_comment.js' %}"></script>
{% endblock %}
