{% extends 'navbar.html' %}
{% load static %}

{% block lang %}zh-Hant{% endblock %}

{% block title %}智能校事專家 - Chatbot{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/chat.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block content %}

<!-- 背景影片 -->
<img class="bg-png" src="{% static 'image/wave.png' %}" width="100%" height="100%" alt="背景圖片">
<!-- 半透明遮罩 -->
<div class="bg-overlay"></div>


    <!-- 將所有內容包裝在一個大的div中，左右padding 80px -->
    <div class="chat-wrapper">
        <!-- 主內容區域 -->
        <div class="main-content" id="mainContent">
            <!-- 包裝 unified-header, sidebar 和 chat-container 的容器 -->
            <div class="content-wrapper">
                <!-- 標題列 -->
                <div class="unified-header">
                    <!-- 菜單按鈕 -->
                    <div class="menu-btn-container" id="menuBtnContainer">
                        <button class="hamburger" id="menuBtn">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </button>
                    </div>
                    
                    <!-- 主內容標題 -->
                    <div class="chat-header-part">
                        <h2 id="currentChatTitle">對話</h2>
                    </div>
                </div>
                
                <!-- 側邊欄 -->
                <div class="sidebar" id="sidebar">
                    <button class="new-chat-btn" id="newChatBtn">
                        <i class="fa-solid fa-plus"></i> <span>新增對話</span>
                    </button>

                    <div class="sidebar-record">
                        <div>---------------  對話歷史  --------------</div>
                    </div>

                    <div class="chat-history" id="chatHistory">
                        <!-- 對話歷史由 JavaScript 動態載入 -->
                    </div>
                </div>
                
                <!-- 聊天容器 (只保留一個) -->
                <div class="chat-container" id="chatContainer">
                    <div class="blobs">
                        <div class="blob"></div>
                        <div class="blob"></div>
                        <div class="blob"></div>
                        <div class="blob"></div>
                        <div class="blob"></div>
                        <div class="blob"></div>
                        <div class="blob"></div>
                    </div>
                    
                    <div class="no-messages" id="noMessages">
                        開始一個新對話或從側邊欄選擇歷史對話
                    </div>
                    <!-- 對話內容由 JavaScript 動態載入 -->
                </div>
            </div>
            <div class="input-container">
                <textarea class="message-input" id="messageInput" placeholder="輸入訊息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

{% endblock %}

{% block body_js %}
<script src="{% static 'js/chat.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
{% endblock %}
