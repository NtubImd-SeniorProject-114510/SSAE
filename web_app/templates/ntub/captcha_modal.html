<!-- 驗證碼輸入模態框 -->
<div id="captchaModal" class="captcha-modal" style="display: none;">
    <div class="captcha-modal-content">
        <div class="captcha-header">
            <h3><i class="fas fa-shield-alt"></i> 驗證碼輸入</h3>
            <button class="captcha-close" onclick="closeCaptchaModal()">&times;</button>
        </div>
        
        <div class="captcha-body">
            <div class="captcha-info">
                <p>系統檢測到需要輸入驗證碼，請查看下方圖片並輸入對應的文字。</p>
            </div>
            
            <div class="captcha-image-container">
                <img id="captchaImage" src="" alt="驗證碼圖片" class="captcha-image">
                <div class="captcha-loading" id="captchaLoading">
                    <i class="fas fa-spinner fa-spin"></i> 載入驗證碼圖片...
                </div>
            </div>
            
            <div class="captcha-input-section">
                <div class="ocr-suggestion" id="ocrSuggestion" style="display: none;">
                    <p><i class="fas fa-robot"></i> AI識別建議: <span id="ocrText"></span></p>
                    <small>請確認AI識別結果是否正確，或手動輸入正確的驗證碼</small>
                </div>
                
                <div class="form-group">
                    <label for="captchaInput">驗證碼:</label>
                    <input type="text" id="captchaInput" class="captcha-input" placeholder="請輸入驗證碼" maxlength="10" autocomplete="off">
                </div>
                
                <div class="captcha-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCaptchaModal()">
                        <i class="fas fa-times"></i> 取消
                    </button>
                    <button type="button" class="btn btn-primary" id="submitCaptcha" onclick="submitCaptcha()">
                        <i class="fas fa-check"></i> 確認登入
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
