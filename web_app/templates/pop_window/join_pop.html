{% load static %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/pop_window/join_pop.css' %}">

<div class="upload-form" id="uploadForm">
    <div class="upload-container">
        <div class="upload-header">
            <div class="upload-title">發起揪團</div>
            <button class="close-btn" id="closeUploadBtn">&times;</button>
        </div>
        
        <form id="create-group-form" action="{% url 'create_activity' %}" method="post" enctype="multipart/form-data">
            <!-- 活動封面 -->
            <div class="form-group">
                <label class="form-label">活動封面圖片（選填）</label>
                <div class="image-upload-container" id="image-upload-area">
                    <div class="image-upload-icon">📷</div>
                    <div class="image-upload-text">點擊上傳圖片或拖曳圖片至此處</div>
                </div>
                <input type="file" id="activity-cover" name="cover_image" accept="image/*" style="display: none;">
                <div class="help-text">建議尺寸：800x400像素，檔案大小不超過2MB</div>
            </div>
            
            <!-- 標題 -->
            <div class="form-group">
                <label for="activity-title" class="form-label" style="margin-top: 20px;">活動標題 <span class="required-star">*</span></label>
                <input type="text" id="activity-title" name="title" class="form-input" placeholder="請輸入活動標題（最多30字）" maxlength="30" required>
            </div>
            
            <!-- 活動類型 & 地點類型 -->
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-type" class="form-label">活動類型 <span class="required-star">*</span></label>
                        <select id="activity-type" name="type" class="form-select" required>
                            <option value="" disabled selected>請選擇活動類型</option>
                            <option value="food">美食</option>
                            <option value="sport">運動</option>
                            <option value="study">讀書</option>
                            <option value="travel">旅遊</option>
                            <option value="movie">電影</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label class="form-label">地點類型 <span class="required-star">*</span></label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="location_type" value="on_campus">
                                <span>校內</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="location_type" value="off_campus">
                                <span>校外</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 校內教室 -->
            <div class="form-group" id="classroom-field" style="display:none;">
                <label for="classroom" class="form-label">教室 <span class="required-star">*</span></label>
                <input type="text" id="classroom" class="form-input" placeholder="例如：承曦樓505、圖書館討論室1">
            </div>

            <!-- 校外地點 -->
            <div class="form-group" id="location-field" style="display:none;">
                <label for="activity-location" class="form-label">活動地點 <span class="required-star">*</span></label>
                <div class="location-input-container">
                    <input type="text" id="activity-location" class="form-input" placeholder="搜尋地點（例：好樂迪）">
                    <div id="location-suggestions" class="location-suggestions"></div>
                </div>
            </div>
            
            <!-- 隱藏欄位 -->
            <input type="hidden" id="selected-address" name="location">
            <input type="hidden" name="latitude" id="selected-latitude">
            <input type="hidden" name="longitude" id="selected-longitude">
            <input type="hidden" name="place_id" id="selected-place-id">

            <!-- 活動說明 -->
            <div class="form-group">
                <label for="activity-description" class="form-label">活動說明 <span class="required-star">*</span></label>
                <textarea id="activity-description" name="description" class="form-textarea" placeholder="請詳細描述活動內容、準備物品、費用說明等資訊..." required></textarea>
            </div>
            
            <!-- 日期時間 -->
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-date" class="form-label">活動日期 <span class="required-star">*</span></label>
                        <input type="date" id="activity-date" name="date" class="form-input" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-time" class="form-label">活動時間 <span class="required-star">*</span></label>
                        <input type="time" id="activity-time" name="time" class="form-input" required>
                    </div>
                </div>
            </div>

            <!-- 報名截止 -->
            <div class="form-group">
                <label for="activity-deadline" class="form-label">報名截止日期 <span class="required-star">*</span></label>
                <input type="date" id="activity-deadline" name="deadline" class="form-input" required>
            </div>

            <!-- 人數設定 -->
            <div class="form-group">
                <label class="form-label">參加人數設定 <span class="required-star">*</span></label>
                <div class="participants-container">
                    <div class="participant-item">
                        <div class="participant-label">
                            <i class="fas fa-user-minus"></i>
                            <span>最少人數</span>
                        </div>
                        <div class="participant-control">
                            <button type="button" class="control-btn minus" data-target="min-participants">
                                <i class="fas fa-minus"></i>
                            </button>
                            <div class="number-display">
                                <input type="number" id="min-participants" name="min_participants" value="2" min="2" max="50" required>
                                <span class="unit">人</span>
                            </div>
                            <button type="button" class="control-btn plus" data-target="min-participants">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="participant-divider">
                        <span class="divider-dash">—</span>
                    </div>
                    
                    <div class="participant-item">
                        <div class="participant-label">
                            <i class="fas fa-user-plus"></i>
                            <span>最多人數</span>
                        </div>
                        <div class="participant-control">
                            <button type="button" class="control-btn minus" data-target="max-participants">
                                <i class="fas fa-minus"></i>
                            </button>
                            <div class="number-display">
                                <input type="number" id="max-participants" name="max_participants" value="10" min="2" required>
                                <span class="unit">人</span>
                            </div>
                            <button type="button" class="control-btn plus" data-target="max-participants">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 聯絡方式選擇 -->
            <div class="form-group">
                <label class="form-label">聯絡方式</label>
                
                <!-- 智能聯絡資訊提醒區域 -->
                <div id="contact-info-reminder" class="contact-info-reminder">
                    <div class="reminder-content">
                        <div class="reminder-icon">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="reminder-text">
                            <span id="contact-status-text">檢查聯絡資訊中...</span>
                        </div>
                        <button type="button" id="edit-contact-btn" class="edit-contact-btn" style="display: none;">
                            <i class="fas fa-edit"></i> 編輯聯絡資訊
                        </button>
                    </div>
                </div>
                
                <!-- 聯絡方式選擇器 -->
                <div class="contact-method-selector">
                    <div class="contact-options">
                        <div class="contact-option">
                            <input type="radio" id="contact-phone" name="contact_method" value="phone">
                            <label for="contact-phone" class="contact-label">
                                <i class="fas fa-phone"></i>
                                <span>電話</span>
                                <span id="phone-display" class="contact-value">未設定</span>
                            </label>
                        </div>
                        
                        <div class="contact-option">
                            <input type="radio" id="contact-line" name="contact_method" value="line">
                            <label for="contact-line" class="contact-label">
                                <i class="fas fa-comments"></i>
                                <span>LINE</span>
                                <span id="line-display" class="contact-value">未設定</span>
                            </label>
                        </div>
                        
                        <div class="contact-option">
                            <input type="radio" id="contact-email" name="contact_method" value="email">
                            <label for="contact-email" class="contact-label">
                                <i class="fas fa-envelope"></i>
                                <span>Email</span>
                                <span id="email-display" class="contact-value">未設定</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- <div class="preview-section">
                <div class="preview-title">
                    <span class="preview-icon">👁</span>
                    預覽效果
                </div>
                <div class="preview-card">
                    <div class="preview-image">
                        圖片預覽區域
                        <div class="preview-tag" id="preview-tag">活動類型</div>
                    </div>
                    <div class="preview-content">
                        <div class="preview-activity-title" id="preview-title">活動標題</div>
                        <div class="preview-info">
                            <div class="preview-location">
                                <span class="location-icon">📍</span>
                                <span id="preview-location">活動地點</span>

                            <div class="preview-time">
                                <span class="time-icon">🕐</span>
                                <span id="preview-time">活動時間</span>
                            </div>
                        </div>
                        <div class="preview-description" id="preview-description">活動說明將顯示在這裡...</div>
                        <div id="preview-map" style="width:100%; height:200px; margin-top:10px; border-radius:8px; overflow:hidden; display:none;"></div>
                    </div>
                </div>
            </div> -->

            <div class="buttons-container">
                <button type="button" class="cancel-btn" id="cancel-create-btn">取消</button>
                <button type="submit" class="submit-btn">發布活動</button>
            </div>
        </form>
    </div>
</div>

<!-- 聯絡資訊編輯模態框 -->
<div id="contact-edit-modal" class="contact-modal" style="display: none;">
    <div class="contact-modal-content">
        <div class="contact-modal-header">
            <h3>編輯聯絡資訊</h3>
            <button type="button" class="contact-modal-close" id="close-contact-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="contact-modal-body">
            <div class="contact-edit-group">
                <label for="edit-phone">電話號碼</label>
                <input type="tel" id="edit-phone" placeholder="請輸入電話號碼">
            </div>
            
            <div class="contact-edit-group">
                <label for="edit-line">LINE ID</label>
                <input type="text" id="edit-line" placeholder="請輸入LINE ID">
            </div>
            
            <div class="contact-edit-group">
                <label for="edit-email">Email</label>
                <input type="email" id="edit-email" placeholder="請輸入Email地址">
            </div>
        </div>
        
        <div class="contact-modal-footer">
            <button type="button" class="contact-btn-cancel" id="cancel-contact-edit">取消</button>
            <button type="button" class="contact-btn-save" id="save-contact-info">儲存</button>
        </div>
    </div>
</div>

<script>
    // 將用戶聯絡資訊傳遞給JavaScript
    window.userContactData = {
        phone: '{{ user_phone|default:"" }}',
        line_id: '{{ user_line_id|default:"" }}',
        email: '{{ user_email|default:"" }}'
    };
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- JavaScript文件由主頁面載入，避免重複載入 -->
