<!-- join_pop.html - 發起揪團彈跳視窗 -->
<div class="upload-form" id="uploadForm">
    <div class="upload-container">
        <div class="upload-header">
            <div class="upload-title">發起揪團</div>
            <button class="close-btn" id="closeUploadBtn">&times;</button>
        </div>
        
        <form id="create-group-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="activity-title" class="form-label">活動標題</label>
                <input type="text" id="activity-title" name="title" class="form-input" placeholder="請輸入活動標題（最多30字）" maxlength="30" required>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-type" class="form-label">活動類型</label>
                        <select id="activity-type" name="type" class="form-select" required>
                            <option value="" disabled selected>請選擇活動類型</option>
                            <option value="food">美食</option>
                            <option value="sport">運動</option>
                            <option value="study">讀書</option>
                            <option value="travel">旅遊</option>
                            <option value="movie">電影</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-location" class="form-label">活動地點</label>
                        <input type="text" id="activity-location" name="location" class="form-input" placeholder="請輸入活動地點" required>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-date" class="form-label">活動日期</label>
                        <input type="date" id="activity-date" name="date" class="form-input" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="activity-time" class="form-label">活動時間</label>
                        <input type="time" id="activity-time" name="time" class="form-input" required>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-col">
                    <div class="form-group">
                        <label for="min-participants" class="form-label">最少參加人數</label>
                        <input type="number" id="min-participants" name="min_participants" class="form-input" min="2" value="2" required>
                    </div>
                </div>
                <div class="form-col">
                    <div class="form-group">
                        <label for="max-participants" class="form-label">最多參加人數</label>
                        <input type="number" id="max-participants" name="max_participants" class="form-input" min="2" value="10" required>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="activity-description" class="form-label">活動說明</label>
                <textarea id="activity-description" name="description" class="form-textarea" placeholder="請詳細描述活動內容、準備物品、費用說明等資訊..." required></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">活動封面圖片</label>
                <input type="file" id="activity-cover" name="cover_image" accept="image/*" required>
                <div class="help-text">建議尺寸：800x400像素，檔案大小不超過2MB</div>
            </div>
            
            <div class="form-group">
                <label for="activity-deadline" class="form-label">報名截止日期</label>
                <input type="date" id="activity-deadline" name="deadline" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="contact-info" class="form-label">聯絡方式（選填）</label>
                <input type="text" id="contact-info" name="contact_info" class="form-input" placeholder="LINE ID、IG、電話等">
            </div>
            
            <div class="buttons-container">
                <button type="button" class="cancel-btn" id="cancel-create-btn">取消</button>
                <button type="submit" class="submit-btn">發布活動</button>
            </div>
        </form>
    </div>
</div>
<script src="https://kit.fontawesome.com/9e4db15554.js" crossorigin="anonymous"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    // 表單元素
    const titleInput = document.getElementById("activity-title");
    const typeSelect = document.getElementById("activity-type");
    const locationInput = document.getElementById("activity-location");
    const dateInput = document.getElementById("activity-date");
    const timeInput = document.getElementById("activity-time");
    const descriptionInput = document.getElementById("activity-description");
    const coverInput = document.getElementById("activity-cover");
    const imageUploadArea = document.getElementById("image-upload-area");

    // 預覽區元素
    const previewTitle = document.getElementById("preview-title");
    const previewTag = document.getElementById("preview-tag");
    const previewLocation = document.getElementById("preview-location");
    const previewTime = document.getElementById("preview-time");
    const previewDescription = document.getElementById("preview-description");
    const previewImage = document.querySelector(".preview-image");

    // 文字預覽更新
    titleInput.addEventListener("input", () => {
        previewTitle.textContent = titleInput.value || "活動標題";
    });

    typeSelect.addEventListener("change", () => {
        const typeText = typeSelect.options[typeSelect.selectedIndex].text;
        previewTag.textContent = typeText || "活動類型";
    });

    locationInput.addEventListener("input", () => {
        previewLocation.textContent = locationInput.value || "活動地點";
    });

    function updateTimePreview() {
        if (dateInput.value && timeInput.value) {
            previewTime.textContent = `${dateInput.value} ${timeInput.value}`;
        } else {
            previewTime.textContent = "活動時間";
        }
    }
    dateInput.addEventListener("change", updateTimePreview);
    timeInput.addEventListener("change", updateTimePreview);

    descriptionInput.addEventListener("input", () => {
        previewDescription.textContent = descriptionInput.value || "活動說明將顯示在這裡...";
    });

    // 圖片預覽更新函式
    function previewFile(file) {
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.style.backgroundImage = `url(${e.target.result})`;
                previewImage.style.backgroundSize = "cover";
                previewImage.style.backgroundPosition = "center";
                previewImage.textContent = "";
            };
            reader.readAsDataURL(file);
        } else {
            previewImage.style.backgroundImage = "";
            previewImage.textContent = "圖片預覽區域";
        }
    }

    // input file 選擇圖片
    coverInput.addEventListener("change", () => {
        previewFile(coverInput.files[0]);
    });

    // 拖曳上傳圖片
    imageUploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        imageUploadArea.classList.add("dragover");
    });

    imageUploadArea.addEventListener("dragleave", (e) => {
        e.preventDefault();
        imageUploadArea.classList.remove("dragover");
    });

    imageUploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        imageUploadArea.classList.remove("dragover");
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) {
            coverInput.files = e.dataTransfer.files; // 同步給 input
            previewFile(file);
        } else {
            alert("請拖入圖片檔案");
        }
    });

});
</script>
