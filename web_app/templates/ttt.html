<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍辨識系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            text-align: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .main-content {
            padding: 40px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 60px 20px;
            margin: 20px 0;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: linear-gradient(45deg, #e3f2fd, #f3e5f5);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .upload-area.dragover {
            border-color: #ff6b6b;
            background: linear-gradient(45deg, #ffebee, #fce4ec);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .upload-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
        }

        .upload-subtext {
            color: #666;
            font-size: 1em;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .preview-section {
            margin: 30px 0;
            text-align: center;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin: 20px 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            display: none;
        }

        .book-info {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            transition: transform 0.3s ease;
        }

        .book-info:hover {
            transform: translateX(10px);
        }

        .book-info h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .info-item {
            margin: 10px 0;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: monospace;
        }

        .info-label {
            font-weight: bold;
            color: #667eea;
            margin-right: 10px;
        }

        .error {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .api-config {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .api-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin: 10px 0;
            transition: border-color 0.3s ease;
        }

        .api-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 書籍辨識系統</h1>
            <p>AI 智慧辨識書籍資訊</p>
        </div>
        
        <div class="main-content">
            <div class="api-config">
                <h3>🔧 API 設定</h3>
                <input type="text" id="apiKey" class="api-input" placeholder="請輸入您的 Google Cloud Vision API 金鑰">
                <small>請在 Google Cloud Console 中啟用 Vision API 並取得 API 金鑰</small>
            </div>

            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">拖拽圖片到這裡或點擊上傳</div>
                    <div class="upload-subtext">支援 JPG, PNG 格式</div>
                </div>
                
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    📁 選擇圖片
                </button>
                <button class="btn btn-secondary" id="cameraBtn">
                    📸 開啟相機
                </button>
            </div>

            <div class="preview-section" id="previewSection"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在辨識書籍資訊...</p>
            </div>
            
            <div class="error" id="error"></div>
            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        let selectedImage = null;

        // 初始化事件監聽器
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const cameraBtn = document.getElementById('cameraBtn');

            // 拖拽上傳
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });

            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            // 相機功能
            cameraBtn.addEventListener('click', openCamera);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('請選擇有效的圖片檔案！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedImage = e.target.result;
                showImagePreview(selectedImage);
                recognizeBook(selectedImage);
            };
            reader.readAsDataURL(file);
        }

        function showImagePreview(imageSrc) {
            const previewSection = document.getElementById('previewSection');
            previewSection.innerHTML = `
                <h3>📖 預覽圖片</h3>
                <img src="${imageSrc}" class="image-preview" alt="預覽圖片">
                <button class="btn btn-primary" onclick="recognizeBook('${imageSrc}')">
                    🔍 開始辨識
                </button>
            `;
        }

        function openCamera() {
            const video = document.createElement('video');
            const canvas = document.createElement('canvas');
            const previewSection = document.getElementById('previewSection');
            
            previewSection.innerHTML = `
                <h3>📹 相機拍照</h3>
                <video id="cameraVideo" autoplay style="max-width: 100%; border-radius: 15px; margin: 20px 0;"></video>
                <div>
                    <button class="btn btn-primary" onclick="takePicture()">📸 拍照</button>
                    <button class="btn btn-secondary" onclick="closeCamera()">❌ 關閉</button>
                </div>
            `;

            const cameraVideo = document.getElementById('cameraVideo');
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(stream => {
                    cameraVideo.srcObject = stream;
                    window.cameraStream = stream;
                })
                .catch(err => {
                    showError('無法開啟相機：' + err.message);
                });
        }

        function takePicture() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            selectedImage = imageData;
            
            closeCamera();
            showImagePreview(imageData);
            recognizeBook(imageData);
        }

        function closeCamera() {
            if (window.cameraStream) {
                window.cameraStream.getTracks().forEach(track => track.stop());
                window.cameraStream = null;
            }
            document.getElementById('previewSection').innerHTML = '';
        }

        async function recognizeBook(imageData) {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                showError('請先輸入 Google Cloud Vision API 金鑰！');
                return;
            }

            showLoading(true);
            hideError();
            hideResults();

            try {
                // 移除 data URL 前綴
                const base64Image = imageData.split(',')[1];
                
                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        requests: [
                            {
                                image: {
                                    content: base64Image
                                },
                                features: [
                                    { type: 'TEXT_DETECTION', maxResults: 10 },
                                    { type: 'DOCUMENT_TEXT_DETECTION', maxResults: 1 }
                                ]
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status}`);
                }

                const data = await response.json();
                processVisionResults(data);
                
            } catch (error) {
                showError('辨識失敗：' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function processVisionResults(data) {
            if (!data.responses || !data.responses[0] || !data.responses[0].textAnnotations) {
                showError('未能辨識到文字，請確保圖片清晰且包含書籍資訊');
                return;
            }

            const fullText = data.responses[0].fullTextAnnotation?.text || '';
            const textAnnotations = data.responses[0].textAnnotations || [];
            
            // 提取書籍資訊
            const bookInfo = extractBookInfo(fullText, textAnnotations);
            displayResults(bookInfo, fullText);
        }

        function extractBookInfo(fullText, textAnnotations) {
            const bookInfo = {
                title: '',
                author: '',
                publisher: '',
                isbn: '',
                price: '',
                rawText: fullText
            };

            // ISBN 辨識 (多種格式)
            const isbnPattern = /(?:ISBN[-\s]?(?:10|13)?[-\s]?:?[-\s]?)?((?:\d[-\s]?){9}[\dX]|(?:\d[-\s]?){12}[\dX])/gi;
            const isbnMatch = fullText.match(isbnPattern);
            if (isbnMatch) {
                bookInfo.isbn = isbnMatch[0].replace(/[^\dX]/gi, '');
            }

            // 價格辨識
            const pricePattern = /(?:定價|價格|售價|NT\$|￥|\$|¥)[\s:：]*(\d+(?:[,，]\d{3})*(?:\.\d{2})?)/gi;
            const priceMatch = fullText.match(pricePattern);
            if (priceMatch) {
                bookInfo.price = priceMatch[0];
            }

            // 出版社辨識
            const publisherKeywords = ['出版', '社', 'Press', 'Publishing', 'Publisher', '印刷'];
            const lines = fullText.split('\n');
            for (let line of lines) {
                for (let keyword of publisherKeywords) {
                    if (line.includes(keyword) && line.length < 50) {
                        bookInfo.publisher = line.trim();
                        break;
                    }
                }
                if (bookInfo.publisher) break;
            }

            // 標題辨識 (通常在頂部，字體較大)
            if (textAnnotations.length > 1) {
                // 取前幾個文字區塊作為可能的標題
                const potentialTitles = textAnnotations.slice(1, 5).map(annotation => annotation.description);
                bookInfo.title = potentialTitles.find(text => text.length > 2 && text.length < 100) || '';
            }

            // 作者辨識
            const authorKeywords = ['作者', '著', '編著', 'Author', 'By', '撰'];
            for (let line of lines) {
                for (let keyword of authorKeywords) {
                    if (line.includes(keyword)) {
                        bookInfo.author = line.replace(keyword, '').replace(/[:：]/g, '').trim();
                        break;
                    }
                }
                if (bookInfo.author) break;
            }

            return bookInfo;
        }

        function displayResults(bookInfo, rawText) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<h3>🔍 辨識結果</h3>';
            
            if (bookInfo.title || bookInfo.author || bookInfo.publisher || bookInfo.isbn) {
                html += '<div class="book-info">';
                html += '<h3>📖 書籍資訊</h3>';
                
                if (bookInfo.title) {
                    html += `<div class="info-item"><span class="info-label">書名：</span>${bookInfo.title}</div>`;
                }
                if (bookInfo.author) {
                    html += `<div class="info-item"><span class="info-label">作者：</span>${bookInfo.author}</div>`;
                }
                if (bookInfo.publisher) {
                    html += `<div class="info-item"><span class="info-label">出版社：</span>${bookInfo.publisher}</div>`;
                }
                if (bookInfo.isbn) {
                    html += `<div class="info-item"><span class="info-label">ISBN：</span>${bookInfo.isbn}</div>`;
                }
                if (bookInfo.price) {
                    html += `<div class="info-item"><span class="info-label">價格：</span>${bookInfo.price}</div>`;
                }
                
                html += '</div>';
            }
            
            // 顯示完整辨識文字
            html += '<div class="book-info">';
            html += '<h3>📝 完整辨識文字</h3>';
            html += `<div class="info-item" style="max-height: 200px; overflow-y: auto; white-space: pre-wrap;">${rawText}</div>`;
            html += '</div>';
            
            resultsDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function hideResults() {
            document.getElementById('results').style.display = 'none';
        }
    </script>
</body>
</html>
