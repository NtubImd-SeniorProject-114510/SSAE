{% load static %}
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎頁面 (Mobile)</title>
</head>
<style>
    html,body{margin:0;padding:0}
    .video-wrap{width:100%;height:100vh;overflow:hidden}
    .video-wrap video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
  </style>

<body>
  
  <div class="video-wrap">
    <video class="welcome-mobile-video" playsinline webkit-playsinline muted autoplay preload="auto"
       poster="{% static 'image/welco_mo_img.jpg' %}">
      <source src="{% static 'image/welcome_mo.mp4' %}" type="video/mp4">
    </video>
  </div>

    <!-- <div class="transition-page">
      <div class="spline-mask">
        <spline-viewer class="spline-box" url="https://prod.spline.design/NqIZdwsMRcqAJ2cW/scene.splinecode"></spline-viewer>
      </div>
    </div>

      <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.93/build/spline-viewer.js"></script>
    -->
    
  </body>
  <script src="{% static 'js/welcome_mo.js' %}"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const v = document.querySelector('video.welcome-mobile-video') || document.querySelector('video');
    if (!v) return;

    // 再次保險把屬性與屬性節點都設上（iOS 有時靠這個才認定為靜音）
    v.muted = true;
    v.defaultMuted = true;
    v.setAttribute('muted', '');
    v.playsInline = true;               // JS 屬性（駝峰）
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');

    // 主動嘗試播放（若被擋，catch 掉即可）
    try { v.play().catch(() => {}); } catch (_) {}

    // 你原本的跳轉/點擊跳轉保留在這段之後就好
  });
</script>

  </html>
